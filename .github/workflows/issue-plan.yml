name: Advisory issue plan

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-plan-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.event.label.name == 'agent:plan' &&
      github.event.issue.state == 'open' &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check triggering actor permission
        id: permission
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ github.token }}
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            const trusted = new Set(['admin', 'maintain', 'write']);
            if (!trusted.has(data.permission)) {
              core.setFailed(`Actor ${context.actor} is not permitted to request an agent plan.`);
            }

      # Checkout is read-only and exists solely to load the reviewed planner script.
      # This workflow never invokes git with write credentials or mutates repository code.
      - name: Check out trusted default-branch code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Generate or update advisory plan comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_API_URL: ${{ secrets.AGENT_API_URL }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          AGENT_MODEL: ${{ secrets.AGENT_MODEL }}
        run: node --experimental-strip-types scripts/agent/issue-plan.ts
