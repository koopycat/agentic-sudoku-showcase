name: Pull request E2E diagnosis

on:
  workflow_run:
    workflows: [Pull request E2E]
    types: [completed]

permissions:
  contents: read
  issues: write
  actions: read
  pull-requests: read
  checks: read

concurrency:
  group: pr-e2e-diagnosis-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: Advisory failure diagnosis
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Deliberately no checkout: this secret-backed job must never execute PR code.
      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.3.0
        with:
          node-version: 22

      - name: Fetch trusted diagnosis runner from the default branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mkdir -p scripts/agent
          fetch_trusted_file() {
            local path="$1"
            local destination="$2"
            curl --fail --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --get --data-urlencode "ref=$DEFAULT_BRANCH" \
              "$API_URL/repos/$REPOSITORY/contents/$path" \
              | jq -er 'select(.type == "file") | .content' \
              | tr -d '\n' \
              | base64 --decode > "$destination"
            test -s "$destination"
          }
          fetch_trusted_file scripts/agent/pr-diagnosis.ts scripts/agent/pr-diagnosis.ts
          fetch_trusted_file scripts/agent/eligibility.ts scripts/agent/eligibility.ts
          fetch_trusted_file scripts/agent/shared.ts scripts/agent/shared.ts

      - name: Run bounded advisory diagnosis
        shell: bash
        env:
          AGENT_API_URL: ${{ secrets.AGENT_API_URL }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          AGENT_MODEL: ${{ secrets.AGENT_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          PULL_REQUEST_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node --experimental-strip-types scripts/agent/pr-diagnosis.ts
